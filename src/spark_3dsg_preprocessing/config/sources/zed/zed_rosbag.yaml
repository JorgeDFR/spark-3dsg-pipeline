name: zed_rosbag
description: ZED ROS 2 wrapper 5.1+ recording; enable tracking to record odometry
input_kind: rosbag2
topics:
  color: /zed/zed_node/rgb/color/rect/image
  color_camera_info: /zed/zed_node/rgb/color/rect/camera_info
  color_right: /zed/zed_node/right/color/rect/image
  depth: /zed/zed_node/depth/depth_registered
  imu: /zed/zed_node/imu/data
  tf: /tf
  tf_static: /tf_static
  odometry: /zed/zed_node/odom
frames:
  odom: odom
  robot: zed_camera_link
  imu: zed_imu_link
  sensor: zed_left_camera_frame_optical
depth:
  mode: registered
  scale: 1.0
  accepted_encodings:
  - 32FC1
