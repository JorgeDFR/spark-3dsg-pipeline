name: generic_rgbd
description: Generic ROS 2 recording with already registered depth and TF
input_kind: rosbag2
topics:
  color: /camera/color/image_raw
  color_camera_info: /camera/color/camera_info
  depth: /camera/aligned_depth_to_color/image_raw
  tf: /tf
  tf_static: /tf_static
frames:
  odom: odom
  robot: camera_link
  sensor: camera_color_optical_frame
depth:
  mode: registered
  scale: 1000.0
  accepted_encodings:
  - 16UC1
