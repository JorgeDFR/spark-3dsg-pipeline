---
launch:
  - arg: {name: bag, description: ROS 2 bag directory or MCAP file}
  - arg: {name: rate, default: '1.0'}
  - arg: {name: color_topic, default: /input/color/image_raw}
  - arg: {name: depth_topic, default: /input/depth/image_rect}
  - arg: {name: camera_info_topic, default: /input/color/camera_info}
  - arg: {name: semantic_topic, default: /input/semantic/instances}
  - arg: {name: labelspace_topic, default: /input/semantic/labelspace}
  - arg: {name: tf_topic, default: /tf}
  - arg: {name: tf_static_topic, default: /tf_static}
  - executable:
      name: bag_player
      output: screen
      cmd: >
        ros2 bag play $(var bag)
        --clock
        --rate $(var rate)
        --disable-keyboard-controls
        --qos-profile-overrides-path $(find-pkg-share spark_3dsg_pipeline)/config/tf_qos.yaml
        --remap
        $(var color_topic):=/input/color/image_raw
        $(var depth_topic):=/input/depth/image_rect
        $(var camera_info_topic):=/input/color/camera_info
        $(var semantic_topic):=/input/semantic/instances
        $(var labelspace_topic):=/input/semantic/labelspace
        $(var tf_topic):=/tf
        $(var tf_static_topic):=/tf_static
