---
launch:
  - arg: {name: rviz, default: 'true'}
  - node:
      pkg: hydra_visualizer
      exec: hydra_visualizer_node
      name: hydra_visualizer
      remap:
        - {from: ~/dsg, to: /hydra/backend/dsg}
      args: '--config-utilities-yaml {graph: {type: GraphFromRos, frame_id: map}}'
  - node:
      if: $(var rviz)
      pkg: rviz2
      exec: rviz2
      name: rviz
      args: -d $(find-pkg-share spark_3dsg_pipeline)/rviz/scene_graph.rviz
