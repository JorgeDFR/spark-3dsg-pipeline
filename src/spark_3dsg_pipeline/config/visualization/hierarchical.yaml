---
# Hierarchical renderer: OBJECTS -> PLACES -> ROOMS -> BUILDINGS, with
# MESH_PLACES displayed as a decoupled surface representation.
#
# This file is the primary visualizer config, not an external-plugin overlay.
# The launch file supplies the live graph transport and map frame. Edit active
# values below to change rendering; alternatives from ADT4 default/classic are
# kept next to the relevant setting as comments. Restart `make rviz` after a
# file edit so the visualizer reads the updated startup configuration.

# Redraw period after a graph/config change.
loop_period_s: 0.1

# GraphFromRos subscribes to ~/dsg. visualization.launch.yaml remaps that topic
# to /hydra/backend/dsg. The launch include also enforces GraphFromRos.
graph:
  type: GraphFromRos
  wrapper_ns: "~"

plugins:
  # MeshPlugin publishes /hydra_visualizer/mesh.
  # An empty coloring type uses RGB colors already stored on mesh vertices.
  # This is the locked Hydra equivalent of ADT4's now-removed
  # `use_color_adaptor: false` field and avoids a uniform semantic color when
  # the ADT4 profile has volumetric semantics disabled.
  mesh:
    type: MeshPlugin
    min_mesh_separation_s: 0.0
    coloring: {type: ''}
    # Semantic alternative for a mesh that actually stores semantic labels:
    # coloring:
    #   type: SemanticMeshColoring
    #   colormap:
    #     palette: {type: distinct150}
    #     default_color: [128, 128, 128]
    #     wrap_colors: true
    # Other valid locked alternatives (require corresponding mesh stamps):
    # coloring: {type: FirstSeenMeshColoring}
    # coloring: {type: LastSeenMeshColoring}
    # coloring: {type: SeenDurationMeshColoring}
    # Uniform alternative:
    # coloring: {type: UniformMeshColoring, color: [160, 160, 160]}

  # Optional diagnostic plugins shipped by the locked visualizer. They are
  # harmless when their target layer or an RViz subscriber is absent.
  places_basis_points:
    type: BasisPointPlugin
    show_voxblox_connections: false
    draw_basis_points: true
    draw_layer_edges: false
    places_edge_scale: 0.05
    places_edge_alpha: 0.5
    basis_point_scale: 0.1
    basis_point_alpha: 0.8
    colormap:
      palette: {type: distinct150}
      default_color: [128, 128, 128]
      wrap_colors: true
    graph:
      visualize: false
      z_offset_scale: 0.0
      draw_frontier_ellipse: false
      nodes: {draw: true, scale: 0.1, color: {type: AttributeColorAdapter}, alpha: 1.0, use_sphere: false}
      edges: {draw: true, scale: 0.03, alpha: 1.0, color: {type: UniformEdgeColorAdapter, color: [0, 0, 0]}, insertion_skip: 0}
      text: {draw: false, draw_layer: false, collapse: false, adapter: {type: IdTextAdapter}, height: 1.0, scale: 0.5, add_jitter: false, jitter_scale: 0.2, color: black}
      bounding_boxes: {draw: false, collapse: false, scale: 0.1, edge_scale: 0.01, alpha: 0.5, edge_break_ratio: 0.5}
      boundaries: {draw: false, collapse: false, wireframe_scale: 0.1, use_node_color: true, alpha: 0.5, draw_ellipse: false, ellipse_alpha: 0.5}

  agent_poses:
    type: PosePlugin
    num_to_skip: 0
    layer: AGENTS
    # `partition` defaults to the agent partition ('a') in the locked source.
    num_received_before_warn: 500

renderer:
  # Layer marker z-offset = layer_z_step * z_offset_scale. Set
  # collapse_layers: true to render all graph layers at their metric height.
  layer_z_step: 2.0
  collapse_layers: false

  layers:
    # OBJECTS (static layer 2)
    2:
      visualize: true
      z_offset_scale: 1.0
      draw_frontier_ellipse: false
      nodes:
        draw: true
        scale: 0.40
        color:
          type: LabelColorAdapter
          colormap:
            palette: {type: distinct150}
            default_color: [128, 128, 128]
            wrap_colors: true
        alpha: 0.8
        use_sphere: false
      edges:
        draw: true
        scale: 0.03
        alpha: 0.5
        color: {type: ''}  # Empty adapter inherits endpoint node colors.
        insertion_skip: 0
      text:
        draw: true
        draw_layer: false
        collapse: true
        # Alternatives: {type: LabelIdTextAdapter}, {type: LabelTextAdapter} or {type: IdTextAdapter}
        adapter: {type: LabelTextAdapter}
        height: 0.5
        scale: 0.45
        add_jitter: false
        jitter_scale: 0.2
        color: black
      bounding_boxes:
        draw: true
        collapse: true
        scale: 0.05
        edge_scale: 0.05
        alpha: 0.9
        edge_break_ratio: 0.5
      boundaries:
        draw: false
        collapse: false
        wireframe_scale: 0.1
        use_node_color: true
        alpha: 0.5
        draw_ellipse: false
        ellipse_alpha: 0.5

    # Classical GVD PLACES (static layer 3).
    3:
      visualize: true
      z_offset_scale: 2.0
      draw_frontier_ellipse: false
      nodes:
        draw: true
        scale: 0.20
        # Alternatives: IdColorAdapter or ParentColorAdapter
        # color:
        #   type: IdColorAdapter
        #   colormap:
        #     palette: {type: colorbrewer}
        #     default_color: [128, 128, 128]
        #     wrap_colors: true
        color:
          type: ParentColorAdapter
          parent_adapter:
            type: IdColorAdapter
            colormap: {palette: {type: colorbrewer}, wrap_colors: true}
          default_color: [128, 128, 128]
        alpha: 0.9
        use_sphere: true
      edges: {draw: true, scale: 0.03, alpha: 0.5, color: {type: ''}, insertion_skip: 0}
      text: {draw: false, draw_layer: false, collapse: false, adapter: {type: IdTextAdapter}, height: 0.5, scale: 0.35, add_jitter: false, jitter_scale: 0.2, color: black}
      bounding_boxes: {draw: false, collapse: false, scale: 0.1, edge_scale: 0.01, alpha: 0.5, edge_break_ratio: 0.5}
      boundaries: {draw: false, collapse: false, wireframe_scale: 0.1, use_node_color: true, alpha: 0.5, draw_ellipse: false, ellipse_alpha: 0.5}

    # ROOMS (static layer 4)
    4:
      visualize: true
      z_offset_scale: 3.0
      draw_frontier_ellipse: false
      nodes:
        draw: true
        scale: 0.60
        color:
          type: IdColorAdapter
          colormap:
            palette: {type: colorbrewer}
            default_color: [128, 128, 128]
            wrap_colors: true
        alpha: 0.8
        use_sphere: false
      edges: {draw: true, scale: 0.10, alpha: 0.2, color: {type: ''}, insertion_skip: 0}
      text: {draw: true, draw_layer: false, collapse: false, adapter: {type: IdTextAdapter}, height: 1.25, scale: 1.0, add_jitter: false, jitter_scale: 0.2, color: black}
      bounding_boxes: {draw: false, collapse: false, scale: 0.1, edge_scale: 0.01, alpha: 0.5, edge_break_ratio: 0.5}
      boundaries: {draw: false, collapse: false, wireframe_scale: 0.1, use_node_color: true, alpha: 0.5, draw_ellipse: false, ellipse_alpha: 0.5}

    # BUILDINGS (static layer 5; generated by the uHumans2 profile)
    5:
      visualize: false
      z_offset_scale: 4.0
      draw_frontier_ellipse: false
      nodes:
        draw: true
        scale: 0.80
        color: {type: UniformColorAdapter, color: [90, 90, 90]}
        alpha: 0.8
        use_sphere: false
      edges: {draw: true, scale: 0.10, alpha: 0.2, color: {type: ''}, insertion_skip: 0}
      text: {draw: true, draw_layer: false, collapse: false, adapter: {type: IdTextAdapter}, height: 1.5, scale: 1.0, add_jitter: false, jitter_scale: 0.2, color: black}
      bounding_boxes: {draw: false, collapse: false, scale: 0.1, edge_scale: 0.01, alpha: 0.5, edge_break_ratio: 0.5}
      boundaries: {draw: false, collapse: false, wireframe_scale: 0.1, use_node_color: true, alpha: 0.5, draw_ellipse: false, ellipse_alpha: 0.5}

    # Dynamic AGENT partitions (dynamic layer 2, partitions >= 1).
    2p*:
      visualize: true
      z_offset_scale: 0.0
      draw_frontier_ellipse: false
      nodes:
        draw: true
        scale: 0.10
        color:
          type: PartitionColorAdapter
          colormap:
            palette: {type: colorbrewer}
            default_color: [128, 128, 128]
            wrap_colors: true
        alpha: 1.0
        use_sphere: true
      edges: {draw: true, scale: 0.10, alpha: 1.0, color: {type: ''}, insertion_skip: 0}
      text: {draw: false, draw_layer: true, collapse: false, adapter: {type: IdTextAdapter}, height: 0.9, scale: 0.8, add_jitter: false, jitter_scale: 0.2, color: black}
      bounding_boxes: {draw: false, collapse: false, scale: 0.1, edge_scale: 0.01, alpha: 0.5, edge_break_ratio: 0.5}
      boundaries: {draw: false, collapse: false, wireframe_scale: 0.1, use_node_color: true, alpha: 0.5, draw_ellipse: false, ellipse_alpha: 0.5}

    # Region-growing/surface MESH_PLACES (dynamic layer 3, partition 1).
    3p1:
      visualize: true
      z_offset_scale: 2.0
      draw_frontier_ellipse: false
      nodes:
        draw: true
        scale: 0.20
        alpha: 0.9
        use_sphere: true
        # Alternatives: UniformColorAdapter, IdColorAdapter or LabelColorAdapter
        # color:
        #   type: UniformColorAdapter
        #   color: [0, 0, 0]
        # color:
        #   type: IdColorAdapter
        #   colormap:
        #     palette: {type: colorbrewer}
        #     default_color: [128, 128, 128]
        #     wrap_colors: true
        color:
          type: LabelColorAdapter
          colormap:
            palette: {type: distinct150}
            wrap_colors: true
      edges: {draw: true, scale: 0.03, alpha: 0.5, color: {type: ''}, insertion_skip: 0}
      text: {draw: false, draw_layer: false, collapse: false, adapter: {type: IdTextAdapter}, height: 0.5, scale: 0.45, add_jitter: false, jitter_scale: 0.2, color: black}
      bounding_boxes: {draw: false, collapse: false, scale: 0.1, edge_scale: 0.01, alpha: 0.5, edge_break_ratio: 0.5}
      boundaries: {draw: true, collapse: false, wireframe_scale: 0.1, use_node_color: true, alpha: 1.0, draw_ellipse: false, ellipse_alpha: 0.5}

    # Alternate block-traversability MESH_PLACES partition supported upstream.
    3p2:
      visualize: false
      z_offset_scale: 2.0
      draw_frontier_ellipse: false
      nodes:
        draw: true
        scale: 0.20
        color:
          type: IdColorAdapter
          colormap: {palette: {type: colorbrewer}, default_color: [128, 128, 128], wrap_colors: true}
        alpha: 0.9
        use_sphere: true
      edges: {draw: true, scale: 0.10, alpha: 0.8, color: {type: TraversabilityEdgeColorAdapter}, insertion_skip: 0}
      text: {draw: false, draw_layer: false, collapse: true, adapter: {type: IdTextAdapter}, height: 0.5, scale: 0.45, add_jitter: false, jitter_scale: 0.2, color: black}
      bounding_boxes: {draw: false, collapse: false, scale: 0.1, edge_scale: 0.01, alpha: 0.5, edge_break_ratio: 0.5}
      boundaries: {draw: true, collapse: false, wireframe_scale: 0.1, use_node_color: true, alpha: 1.0, draw_ellipse: false, ellipse_alpha: 0.5}

  interlayer_edges:
    # Suppress place-to-agent clutter.
    - {from: 3, to: 2p*, draw: false, scale: 0.03, alpha: 1.0, color: {type: ''}, insertion_skip: 0, use_child_color: false}
    - {from: 3, to: 2, draw: true, scale: 0.08, alpha: 0.5, color: {type: ''}, insertion_skip: 0, use_child_color: true}
    - {from: 4, to: 3, draw: true, scale: 0.08, alpha: 0.5, color: {type: ''}, insertion_skip: 0, use_child_color: false}
    - {from: 5, to: 4, draw: true, scale: 0.08, alpha: 0.5, color: {type: ''}, insertion_skip: 0, use_child_color: false}

  # layer_plugins:
  #   - layer: 3p1
  #     plugins:
  #       - type: RegionGrowingBoundaryPlugin
  #         use_node_color: true
  #         colors:
  #           - [128, 128, 128]
  #           - [0, 0, 255]
  #           - [255, 0, 0]
  #           - [0, 255, 0]
  #         line_width: 0.07
  #         fill_alpha: 0.15
  #         fill_boundaries: false
