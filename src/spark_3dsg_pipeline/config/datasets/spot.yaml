name: spot
description: Public ADT4 Hamilton Spot bag, payload ZED RGB-D stream
topics:
  color: /hamilton/hamilton_zed/rgb/image_rect_color
  depth: /hamilton/hamilton_zed/depth/depth_registered
  camera_info: /hamilton/hamilton_zed/rgb/camera_info
  tf: /tf
  tf_static: /tf_static
frames:
  map: hamilton/map
  odom: hamilton/odom
  robot: hamilton/base_link
  sensor: hamilton_zed_left_camera_optical_frame
depth_scale: 1.0
depth_encodings: [32FC1]
use_sim_time: true
scene_structure: khronos
semantics:
  source: open_set
  perception_config: spark_3dsg_pipeline:config/perception/yoloe.yaml
  labels_config: spark_3dsg_pipeline:config/perception/labels/adt4.yaml
  labelspace_config: spark_3dsg_pipeline:config/labelspaces/from_message.yaml
  pipeline_config: spark_3dsg_pipeline:config/labelspaces/no_remap.yaml
visualization: {profile: khronos}
hydra_config: adt4.yaml
playback_rate: 1.0
