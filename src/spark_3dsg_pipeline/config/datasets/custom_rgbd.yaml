name: custom_rgbd
description: Example normalized RGB-D input (adapt frames and depth units to your recording)
topics:
  color: /input/color/image_raw
  depth: /input/depth/image_rect
  camera_info: /input/color/camera_info
  tf: /tf
  tf_static: /tf_static
frames:
  map: map
  odom: odom
  robot: base_link
  sensor: camera_color_optical_frame
depth_scale: 1000.0
depth_encodings: [16UC1, 32FC1]
use_sim_time: true
playback_rate: 1.0
