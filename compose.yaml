name: spark-3dsg-pipeline

x-common: &common
  network_mode: host
  ipc: host
  environment:
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
    RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
  volumes:
    - ${DATA_DIR:-./data}:/home/spark/data:ro
    - ${MODEL_DIR:-./models}:/home/spark/models
    - ${OUTPUT_DIR:-./output}:/home/spark/output
    - ./examples:/home/spark/examples:ro
    - spark-cache:/home/spark/.cache
  working_dir: /home/spark/spark-3dsg-pipeline
  stdin_open: true
  tty: true

services:
  preprocess:
    <<: *common
    profiles: [preprocess]
    image: spark-3dsg-preprocess:local
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      NVIDIA_DRIVER_CAPABILITIES: all
    build:
      context: .
      dockerfile: docker/Dockerfile.preprocess
      args:
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}
    volumes:
      - ${DATA_DIR:-./data}:/home/spark/data
      - ${OUTPUT_DIR:-./output}:/home/spark/output
      # Docker initializes new volumes from the spark-owned image directories.
      - zed-settings:/usr/local/zed/settings
      - zed-resources:/usr/local/zed/resources
    gpus: all

  core:
    <<: *common
    profiles: [core]
    image: spark-3dsg-core:local
    build:
      context: .
      dockerfile: docker/Dockerfile.core
      args:
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}

  core-dev:
    <<: *common
    profiles: [dev]
    image: spark-3dsg-core:local
    build:
      context: .
      dockerfile: docker/Dockerfile.core
      args:
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}

  pipeline:
    <<: *common
    profiles: [gpu]
    image: spark-3dsg-gpu:local
    build:
      context: .
      dockerfile: docker/Dockerfile.gpu
      args:
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}
    gpus: all

  data-setup:
    profiles: [tools]
    image: spark-3dsg-core:local
    build:
      context: .
      dockerfile: docker/Dockerfile.core
      args:
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}
    volumes:
      - ${DATA_DIR:-./data}:/home/spark/data
    working_dir: /home/spark/spark-3dsg-pipeline
    command: ["python3", "/home/spark/spark-3dsg-pipeline/scripts/python/prepare_example_bags.py"]

  rviz:
    <<: *common
    profiles: [rviz]
    image: spark-3dsg-core:local
    build:
      context: .
      dockerfile: docker/Dockerfile.core
      args:
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
    volumes:
      - ${DATA_DIR:-./data}:/home/spark/data:ro
      - ${MODEL_DIR:-./models}:/home/spark/models
      - ${OUTPUT_DIR:-./output}:/home/spark/output
      - ./examples:/home/spark/examples:ro
      - spark-cache:/home/spark/.cache
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: ["/home/spark/spark-3dsg-pipeline/scripts/shell/run_visualization.sh", "--dataset", "spot", "--mapping", "open_set"]

volumes:
  spark-cache:
  zed-settings:
  zed-resources:
