name: validation_tum_fr1
description: TUM Freiburg 1 RGB-D sequence adapted to the normalized contract
input_kind: rosbag2
topics:
  color: /camera/rgb/image_color
  color_camera_info: /camera/rgb/camera_info
  depth: /camera/depth/image
frames:
  odom: odom
  robot: camera_link
  sensor: openni_rgb_optical_frame
depth:
  mode: registered
  frame_id: openni_rgb_optical_frame
  scale: 1.0
  accepted_encodings: [32FC1]
static_transforms:
  - parent: camera_link
    child: openni_rgb_optical_frame
    translation: [0.0, 0.0, 0.0]
    rotation: [0.0, 0.0, 0.0, 1.0]
